<div class="navbar-area navbar-expand-lg">
    <div class="container-fluid">
        <nav class="navbar">
            <div class="navbar-brand">
                <img src="/images/logo.png" alt="MatchyKhedma Logo">
                <div class="header-brand">
                    <h5>MatchyKhedma</h5>
                    <p class="brand-subtitle">Candidates Dashboard</p>
                </div>
            </div>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <button type="button" class="dropdown-toggle nav-link" (click)="toggleDropdown('formations')">
                        Formations
                    </button>
                    <ul class="dropdown-menu" [class.show]="activeDropdown === 'formations'">
                        <li class="nav-item">
                            <a routerLink="/formations" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Liste des formations
                            </a>
                        </li>
                        <li class="nav-item">
                            <a routerLink="/formations/mes-formations" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Mes formations
                            </a>
                        </li>
                        <li class="nav-item">
                            <a routerLink="/formations/admin" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Gérer les formations
                            </a>
                        </li>
                        <li class="nav-item">
                            <a routerLink="/formations/admin/create" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Ajouter une formation
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <button type="button" class="dropdown-toggle nav-link" (click)="toggleDropdown('candidates')">
                        Candidates
                    </button>
                    <ul class="dropdown-menu" [class.show]="activeDropdown === 'candidates'">
                        <li class="nav-item">
                            <a routerLink="/candidates" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Candidates
                            </a>
                        </li>
                        <li class="nav-item">
                            <a routerLink="/candidate-details" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Candidate Details
                            </a>
                        </li>
                        <li class="nav-item">
                            <a routerLink="/candidates-dashboard" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Candidates Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a routerLink="/candidate-entretiens" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                Mes Entretiens
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>

            <div class="header-actions">
                <div class="search-container">
                    <i class="ri-search-line search-icon"></i>
                    <input
                        type="text"
                        placeholder="Search users..."
                        [(ngModel)]="searchTerm"
                        (input)="onSearchChange()"
                        (focus)="showSearchResults = true"
                        (blur)="onSearchBlur()"
                    />
                    <button
                        type="button"
                        class="clear-btn"
                        *ngIf="searchTerm"
                        (click)="clearSearch()"
                    >
                        ✕
                    </button>

                    <div class="search-results" *ngIf="showSearchResults">
                        <div class="search-status" *ngIf="isSearching">
                            Searching...
                        </div>
                        <div class="search-status" *ngIf="!isSearching && searchResults.length === 0 && searchTerm">
                            No users found
                        </div>
                        <button
                            type="button"
                            class="search-result-item"
                            *ngFor="let user of searchResults"
                            (click)="selectUser(user)"
                        >
                            <div class="result-content">
                                <div class="result-info">
                                    <span class="result-name">{{ user.nom }}</span>
                                    <span class="result-email">{{ user.email }}</span>
                                </div>
                                <div class="result-actions">
                                    <button type="button" class="follow-btn">Suivre</button>
                                    <span class="result-tag" *ngIf="user.role">{{ user.role }}</span>
                                </div>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <button type="button" class="notification-btn">
                    <i class="ri-notification-3-line"></i>
                    <span class="notification-badge" *ngIf="unreadNotifications > 0">{{ unreadNotifications }}</span>
                </button>

                <button type="button" class="user-profile-button" (click)="toggleDropdown('profile')">
                    <img [src]="displayProfilePictureUrl" alt="Candidate image" class="user-image" />
                    <div class="user-info">
                        <span class="user-greeting">Welcome,</span>
                        <span class="user-name">{{ currentUserName }}</span>
                    </div>
                </button>

                <ul class="header-dropdown-menu" [class.show]="activeDropdown === 'profile'">
                    <li>
                        <button type="button" class="dropdown-item" (click)="logout()">
                            <i class="ri-logout-box-r-line"></i>
                            Logout
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</div>
