<!-- Chargement -->
<div class="cev-loading" *ngIf="isLoading">
  <div class="cev-loading__spinner">
    <div class="cev-loading__ring"></div>
  </div>
  <p>Chargement du chat...</p>
</div>

<!-- Conteneur principal -->
<div class="cev-wrapper" *ngIf="!isLoading">

  <!-- Erreur -->
  <div *ngIf="erreur" class="cev-error">
    <i class="ri-error-warning-line"></i>
    <p>{{ erreur }}</p>
  </div>

  <!-- Chat fermé -->
  <div *ngIf="!chatOuvert && !erreur" class="cev-closed">
    <div class="cev-closed__icon">
      <i class="ri-lock-line"></i>
    </div>
    <h3>Chat non disponible</h3>
    <p>Le salon s'ouvre 24h avant l'événement et ferme 3h après le début.</p>
  </div>

  <!-- Chat ouvert -->
  <div class="cev-container" *ngIf="chatOuvert">

    <!-- Header -->
    <div class="cev-header">
      <div class="cev-header__left">
        <div class="cev-header__icon">
          <i class="ri-chat-3-line"></i>
        </div>
        <div class="cev-header__text">
          <span class="cev-header__title">Salon de discussion</span>
          <span class="cev-header__sub">{{ messages.length }} message(s)</span>
        </div>
      </div>
      <span class="cev-live-badge">
        <span class="cev-live-badge__dot"></span>
        LIVE
      </span>
    </div>

    <!-- Messages -->
    <div class="cev-messages" #messagesContainer>
      <div
        *ngFor="let msg of messages"
        class="cev-message"
        [class.cev-message--moi]="msg.candidatId === candidatId">

        <span class="cev-message__auteur">{{ msg.nomExpediteur }}</span>
        <div class="cev-message__bulle">{{ msg.contenu }}</div>
        <span class="cev-message__heure">{{ formatHeure(msg.envoyeA) }}</span>
      </div>
    </div>

    <!-- Input -->
    <div class="cev-input">
      <input
        type="text"
        [(ngModel)]="nouveauMessage"
        placeholder="Votre message..."
        (keydown)="onKeyDown($event)" />

      <button (click)="envoyer()" [disabled]="envoyerEnCours">
        <i class="ri-send-plane-fill" *ngIf="!envoyerEnCours"></i>
        <i class="ri-loader-4-line" *ngIf="envoyerEnCours"></i>
      </button>
    </div>

  </div>

</div>
