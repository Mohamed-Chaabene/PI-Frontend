<div class="freelance-wrapper">
  <div class="fl-espace-badge">Espace Freelance</div>
  <a routerLink="/freelance/projects" class="fl-back-link">← Retour aux missions</a>

  <div *ngIf="loading" class="fl-loading">Chargement...</div>
  <div *ngIf="erreur" class="fl-error">{{ erreur }}</div>

  <div class="fl-detail-card" *ngIf="mission && !loading">
    <div class="fl-detail-header">
      <h1 class="fl-title">{{ mission.titre }}</h1>
      <span class="fl-status-badge" [ngClass]="{
        'fl-open':    mission.statut === 'OUVERTE',
        'fl-closed':  mission.statut === 'FERMEE',
        'fl-ongoing': mission.statut === 'EN_COURS'
      }">{{ mission.statut }}</span>
    </div>

    <p class="fl-detail-desc">{{ mission.description }}</p>

    <div class="fl-detail-meta">
      <div class="fl-meta-item">
        <span class="fl-meta-label">Budget</span>
        <span class="fl-meta-value">{{ mission.budget }} TND</span>
      </div>
      <div class="fl-meta-item">
        <span class="fl-meta-label">Compétences requises</span>
        <div class="fl-skills">
          <span class="fl-skill-tag"
                *ngFor="let comp of mission.competences">{{ comp }}</span>
        </div>
      </div>
      <div class="fl-meta-item" *ngIf="mission.postedByNom">
        <span class="fl-meta-label">Publié par</span>
        <span class="fl-meta-value">{{ mission.postedByNom }}</span>
      </div>
    </div>

    <div *ngIf="postule" class="fl-success-inline">
      Candidature envoyée avec succès ✓
    </div>

    <button
      class="fl-apply-btn"
      (click)="postuler()"
      [disabled]="postule || mission.statut !== 'OUVERTE'">
      {{ postule ? 'Candidature envoyée ✓' : '+ Postuler à cette mission' }}
    </button>
  </div>
</div>
