<div class="freelance-wrapper">
  <div class="fl-espace-badge">Espace Freelance</div>
  <div class="fl-page-header">
    <h1 class="fl-title">Missions disponibles</h1>
    <a routerLink="/freelance" class="fl-back-btn">← Tableau de bord</a>
  </div>

  <div *ngIf="loading" class="fl-loading">Chargement des missions...</div>
  <div *ngIf="erreur" class="fl-error">{{ erreur }}</div>

  <div class="fl-missions-list" *ngIf="!loading && !erreur">
    <div *ngIf="missions.length === 0" class="fl-empty">
      Aucune mission disponible pour le moment.
    </div>
    <div class="fl-mission-card"
         *ngFor="let mission of missions"
         [routerLink]="['/freelance/projects', mission.id]">
      <div class="fl-mission-header">
        <span class="fl-mission-title">{{ mission.titre }}</span>
        <span class="fl-status-badge" [ngClass]="{
          'fl-open':    mission.statut === 'OUVERTE',
          'fl-closed':  mission.statut === 'FERMEE',
          'fl-ongoing': mission.statut === 'EN_COURS'
        }">{{ mission.statut }}</span>
      </div>
      <p class="fl-mission-desc">{{ mission.description }}</p>
      <div class="fl-mission-footer">
        <span class="fl-budget">{{ mission.budget }} TND</span>
        <div class="fl-skills">
          <span class="fl-skill-tag"
                *ngFor="let comp of mission.competences">{{ comp }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
