<div class="mk-shell">

  <!-- Header -->
  <header class="mk-header">
    <div class="mk-header__inner">

      <!-- Brand -->
      <a class="mk-brand" routerLink="/freelance/dashboard">
        <div class="mk-brand__icon">MK</div>
        <div class="mk-brand__name">
          Matchy Khedma
          <span>Connexion & Carrière</span>
        </div>
      </a>

      <!-- Nav -->
      <nav class="mk-nav">
        <a routerLink="/freelance/dashboard" routerLinkActive="active" class="mk-nav__link">
          <span class="mk-nav__icon">⬛</span> Dashboard
        </a>
        <a routerLink="/freelance/jobs" routerLinkActive="active" class="mk-nav__link">
          <span class="mk-nav__icon">🔍</span> Find Jobs
        </a>
        <a routerLink="/freelance/my-work" routerLinkActive="active" class="mk-nav__link">
          <span class="mk-nav__icon">📁</span> My Work
        </a>
        <a routerLink="/freelance/invoices" routerLinkActive="active" class="mk-nav__link">
          <span class="mk-nav__icon">🧾</span> Invoices
        </a>
        <a routerLink="/freelance/profile" routerLinkActive="active" class="mk-nav__link">
          <span class="mk-nav__icon">👤</span> Profile
        </a>
      </nav>

      <!-- Right -->
      <div class="mk-header__right">

        <!-- Mode Toggle -->
        <div class="mk-mode-toggle">
          <button
            class="mk-mode-toggle__btn"
            [class.active]="currentMode === 'freelancer'"
            (click)="switchToFreelancer()">
            Freelancer
          </button>
          <button
            class="mk-mode-toggle__btn"
            [class.active]="currentMode === 'client'"
            (click)="switchToClient()">
            Client
          </button>
        </div>

        <!-- Credits -->
        <div class="mk-credits" (click)="this['goToUnits']()">
          <div class="mk-credits__dot"></div>
          41 pts
        </div>

        <!-- Notifications -->
        <div class="mk-notif" (click)="showNotifications()">
          🔔
          <span class="mk-notif__badge">2</span>
        </div>

        <!-- Profile -->
        <div class="mk-avatar-btn" (click)="showProfileMenu()">
          <div class="mk-avatar">RA</div>
          <div class="mk-avatar__info">
            <p class="name">Ranim A.</p>
            <p class="role">Freelancer</p>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Page content -->
  <main class="mk-content">
    <router-outlet></router-outlet>
  </main>

</div>
