<app-navbar />

<section class="video-room-area ptb-100">
  <div class="container">
    <div class="video-room-head">
      <h2>{{ entretienTitle }}</h2>
      <p>Salle d'entretien video integree.</p>
    </div>

    <div *ngIf="loading" class="state-box">Chargement de la salle video...</div>

    <div *ngIf="!loading && errorMessage" class="state-box error">
      <p>{{ errorMessage }}</p>
      <div class="actions">
        <button type="button" class="btn btn-outline-primary" (click)="goBack()">Retour</button>
        <button type="button" class="btn btn-primary" (click)="openExternalMeeting()" *ngIf="meetingLink">Ouvrir le lien externe</button>
      </div>
    </div>

    <div *ngIf="!loading && !errorMessage" class="room-shell">
      <div class="room-frame" #jitsiContainer></div>
    </div>
  </div>
</section>

<app-footer />
