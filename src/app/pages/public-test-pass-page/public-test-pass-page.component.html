<app-navbar />

<section class="test-pass-area ptb-100">
  <div class="container">
    <div class="test-pass-head">
      <h2>Passer l'entretien test</h2>
      <p>Repondez aux questions puis validez pour enregistrer votre score.</p>
    </div>

    <div *ngIf="loading" class="state-box">Chargement des questions...</div>
    <div *ngIf="!loading && loadError" class="state-box error">{{ loadError }}</div>

    <div *ngIf="!loading && !loadError && questions.length === 0" class="state-box">
      Cet entretien ne contient pas encore de questions.
    </div>

    <div *ngIf="!loading && !loadError && questions.length > 0" class="questions-wrap">
      <article class="question-card" *ngFor="let q of questions; let i = index">
        <div class="question-meta">Question {{ i + 1 }} - {{ q.points || 1 }} pt(s)</div>
        <h3>{{ getQuestionText(q) }}</h3>

        <div class="choices" *ngIf="q.choix?.length">
          <label class="choice" *ngFor="let c of q.choix; let idx = index">
            <input
              *ngIf="!isQcm(q)"
              type="radio"
              [name]="'q_' + q.id"
              [value]="idx"
              [(ngModel)]="answers[q.id]"
            />

            <input
              *ngIf="isQcm(q)"
              type="checkbox"
              [checked]="isSelectedQcm(q.id, idx)"
              (change)="toggleQcmSelection(q.id, idx)"
            />

            <span>{{ getChoiceText(c) }}</span>
          </label>
        </div>
      </article>

      <div class="actions">
        <button class="btn-submit" [disabled]="submitting" (click)="submitTest()">
          {{ submitting ? 'Envoi en cours...' : 'Valider mes reponses' }}
        </button>
        <button class="btn-back" type="button" (click)="goHome()">Retour accueil</button>
      </div>

      <div class="result-box" *ngIf="resultMessage">
        {{ resultMessage }}
      </div>
    </div>
  </div>
</section>

<app-footer />
