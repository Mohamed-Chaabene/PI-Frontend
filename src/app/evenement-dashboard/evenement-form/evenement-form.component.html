<div class="breadcrumb-title">
    <h1 class="mb-0 fw-semibold">Ajouter un Événement</h1>
</div>

<div class="alert alert-success" *ngIf="success">
    <i class="ri-check-line"></i> Événement publié avec succès !
</div>
<div class="alert alert-danger" *ngIf="error">
    <i class="ri-close-line"></i> Erreur lors de la publication !
</div>

<div class="jove-card">
    <h3 class="title">Informations de l'événement</h3>

    <form [formGroup]="form" (ngSubmit)="publier()">
        <div class="row">

            <!-- Titre -->
            <div class="col-md-6">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Titre</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="titre"
                        placeholder="Titre de l'événement"
                        [class.is-invalid]="titre?.invalid && titre?.touched"
                        [class.is-valid]="titre?.valid && titre?.touched"
                    >
                    <div class="error-msg" *ngIf="titre?.invalid && titre?.touched">
                        <span *ngIf="titre?.errors?.['required']">Le titre est obligatoire</span>
                        <span *ngIf="titre?.errors?.['minlength']">Minimum 3 caractères</span>
                    </div>
                </div>
            </div>

            <!-- Date -->
            <div class="col-md-6">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Date</label>
                    <input
                        type="date"
                        class="form-control"
                        formControlName="date"
                        [class.is-invalid]="date?.invalid && date?.touched"
                        [class.is-valid]="date?.valid && date?.touched"
                    >
                    <div class="error-msg" *ngIf="date?.invalid && date?.touched">
                        <span *ngIf="date?.errors?.['required']">La date est obligatoire</span>
                    </div>
                </div>
            </div>

            <!-- Lieu -->
            <div class="col-md-6">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Lieu</label>
                    <input
                        type="text"
                        class="form-control"
                        formControlName="lieu"
                        placeholder="Lieu de l'événement"
                        [class.is-invalid]="lieu?.invalid && lieu?.touched"
                        [class.is-valid]="lieu?.valid && lieu?.touched"
                    >
                    <div class="error-msg" *ngIf="lieu?.invalid && lieu?.touched">
                        <span *ngIf="lieu?.errors?.['required']">Le lieu est obligatoire</span>
                        <span *ngIf="lieu?.errors?.['minlength']">Minimum 2 caractères</span>
                    </div>
                </div>
            </div>

            <!-- Type -->
            <div class="col-md-6">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Type</label>
                    <select
                        class="form-select"
                        formControlName="type"
                        [class.is-invalid]="type?.invalid && type?.touched"
                        [class.is-valid]="type?.valid && type?.touched"
                    >
                        <option value="">Choisir un type</option>
                        <option value="JOB_FAIR">Job Fair</option>
                        <option value="WORKSHOP">Workshop</option>
                        <option value="CONFERENCE">Conférence</option>
                        <option value="NETWORKING">Networking</option>
                    </select>
                    <div class="error-msg" *ngIf="type?.invalid && type?.touched">
                        <span *ngIf="type?.errors?.['required']">Le type est obligatoire</span>
                    </div>
                </div>
            </div>

            <!-- Boutons -->
            <div class="col-md-12">
                <div class="d-flex gap-3">
                    <button type="submit" class="btn-submit">
                        <i class="ri-check-line"></i> Publier
                    </button>
                    <button type="button" class="btn-cancel" (click)="annuler()">
                        <i class="ri-close-line"></i> Annuler
                    </button>
                </div>
            </div>

        </div>
    </form>
</div>
