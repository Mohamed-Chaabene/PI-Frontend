<!-- Title -->
<div class="breadcrumb-title">
    <h1 class="mb-0 fw-semibold">Demandes de participation</h1>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="text-center py-4">
    <p>Chargement...</p>
</div>

<!-- Liste des demandes -->
<div class="jove-card" *ngIf="!isLoading">
    <h3 class="title">
        Demandes en attente
        <span class="badge ms-2" style="background:#f9a825; color:white; padding:4px 10px; border-radius:20px; font-size:14px;">
            {{ demandes.length }}
        </span>
    </h3>

    <!-- Vide -->
    <div class="text-center py-4" *ngIf="demandes.length === 0">
        <i class="ri-inbox-line" style="font-size:40px; color:#ccc;"></i>
        <p>Aucune demande en attente</p>
    </div>

    <!-- Liste -->
    <div class="row jobs-applied-recently">
        <div class="col-xxl-12" *ngFor="let d of demandes">
            <div class="single-job-box">
                <div class="d-sm-flex align-items-center justify-content-between">
                    <div class="d-sm-flex align-items-center">
                        <div class="image">
                            <i class="ri-user-line"
                               style="font-size:30px; color:var(--primaryColor); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%)">
                            </i>
                        </div>
                        <div class="content">
                            <h3 class="fw-semibold">{{ d.nomCandidat }}</h3>
                            <span class="location d-block">
                                <i class="ri-calendar-event-line"></i>
                                {{ d.titreEvenement }}
                            </span>
                            <span class="job-type d-block">
                                {{ d.statut }}
                            </span>
                        </div>
                    </div>

                    <!-- Boutons accepter/refuser -->
                    <div class="custom-info d-sm-flex align-items-center gap-2">
                        <button class="btn-accepter" (click)="accepter(d.id)">
                            <i class="ri-check-line"></i> Accepter
                        </button>
                        <button class="btn-refuser" (click)="refuser(d.id)">
                            <i class="ri-close-line"></i> Refuser
                        </button>
                    </div>
                </div>

                <div class="info d-sm-flex align-items-center justify-content-between">
                    <span class="created d-block">
                        <span class="fw-semibold">Date inscription:</span>
                       {{ formatDate(d.dateInscription) }}
                    </span>
                    <span class="salary d-block">
                        <span class="fw-semibold">Événement:</span>
                        <span>{{ d.titreEvenement }}</span>
                    </span>
                    <span class="deadline d-block">
                        <span class="fw-semibold">Statut:</span>
                        {{ d.statut }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
